<h2 class="h4 mb-4">Profil Saya</h2>
<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Edit Profil</h5>
        <form class="row g-3 mt-2">
          <div class="col-12 text-center">
            <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" class="rounded-circle mb-2" width="120" height="120"/>
            <button type="button" class="btn btn-sm btn-light">Ubah Foto</button>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" value="Fitri Arza"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="fitri.arza@email.com"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Universitas</label>
            <input type="text" class="form-control" value="Universitas Teknologi Canggih"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Jurusan</label>
            <input type="text" class="form-control" value="Teknik Informatika"/>
          </div>
          <div class="col-12">
            <label class="form-label">Ringkasan Diri / Bio</label>
            <textarea class="form-control" rows="3">Mahasiswa tingkat akhir dengan minat pada pengembangan web dan analisis data.</textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Keahlian (Skills)</label>
            <input type="text" class="form-control" value="HTML, CSS, JavaScript, PHP, Python"/>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Upload Dokumen</h5>
        <div class="mb-3">
          <label class="form-label">CV / Resume (PDF)</label>
          <input class="form-control" type="file"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Portofolio (PDF/Link)</label>
          <input class="form-control" type="text" placeholder="https://linkportofolio.com"/>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Tampilan Profil Publik</h5>
        <div class="text-center p-3 border rounded mt-2">
          <img src="https://i.pravatar.cc/150?u=a042581f4e29026704d" class="rounded-circle mb-2" width="80" height="80"/>
          <h6 class="mb-0">
            Fitri Arza
            <span class="badge bg-success"><i class="fas fa-check-circle"></i> Terverifikasi</span>
          </h6>
          <p class="text-muted">Universitas Teknologi Canggih</p>
          <div>
            <span class="badge bg-primary-subtle text-primary-emphasis">PHP</span>
            <span class="badge bg-primary-subtle text-primary-emphasis">Python</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
